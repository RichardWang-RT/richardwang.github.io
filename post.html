<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's|Update</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article class="post-single">
            <div id="post-content">
                <!-- Post content will be loaded here -->
            </div>

            <div class="post-meta">
                <span class="post-author"></span>
                <span class="post-date"></span>
                <div class="post-tags"></div>
            </div>

            <div class="social-share">
                <h3>Share this post</h3>
                <div class="share-buttons">
                    <button class="share-btn twitter" onclick="sharePost('twitter')">
                        <span>Twitter</span>
                    </button>
                    <button class="share-btn facebook" onclick="sharePost('facebook')">
                        <span>Facebook</span>
                    </button>
                    <button class="share-btn linkedin" onclick="sharePost('linkedin')">
                        <span>LinkedIn</span>
                    </button>
                </div>
            </div>

            <div class="related-posts">
                <h3>Related Posts</h3>
                <div id="related-posts-container">
                    <!-- Related posts will be loaded here -->
                </div>
            </div>

            <div class="comments-section">
                <h3>Comments</h3>
                <div id="disqus_thread"></div>
            </div>
        </article>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Richard Wang. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js?v=2"></script>
</body>
</html>
